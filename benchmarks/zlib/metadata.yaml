name: zlib
domain: compression
version: "1.3.1"
url: "https://zlib.net/fossils/zlib-1.3.1.tar.gz"

build:
  configure: "CC=afl-gcc ./configure --static"
  make: "make -j$(nproc)"
  products:
    - minigzip
    - minigzip64

target:
  binary: minigzip
  args: ["-d"]
  stdin_mode: true      # reads from stdin
  file_mode: false      # does not accept filename argument

seeds:
  dir: seeds/
  source: generated     # generated by compressing test strings
  count: 5
  files:
    - s1.gz   # "hello world"
    - s2.gz   # 1000 'A's
    - s3.gz   # 500 bytes from README
    - s4.gz   # 200 random bytes
    - s5.gz   # empty input

issues: []

notes: |
  Static build to simplify PIN's binary tracing.
  Uses built-in zlib source; no external dependencies.

expected:
  build_time_sec: 30
  afl_exec_per_sec: ~2000
  typical_candidates_per_3min: 300
